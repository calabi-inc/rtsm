[project]
name = "rtsm"
version = "0.1.1"
description = "Real-Time Spatio-Semantic Memory for spatial AI and robotics"
readme = "README.md"
requires-python = ">=3.10,<3.14"   # 3.10 = JetPack 6.x floor (edge/ARM); verified no 3.12-only syntax
dependencies = [
    # Core
    "numpy",
    "Pillow>=7.1.2",
    "PyYAML>=5.3.1",
    "requests>=2.23.0",
    "scipy>=1.4.1",
    "tqdm>=4.64.0",
    "pandas>=1.1.4",
    "opencv-python-headless>=4.6.0",
    "psutil>=7.0.0",
    "setuptools>=64",
    # API
    "fastapi>=0.95.0",
    "uvicorn[standard]>=0.22.0",
    "prometheus-client>=0.16.0",
    # ZeroMQ
    "pyzmq>=25.0.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "open-clip-torch",
    "sam2>=1.0",
    "transformers>=4.44.0",
    "faiss-cpu>=1.12.0",
]
gpu-ultralytics = [
    "rtsm[gpu]",
    "ultralytics>=8.4.0",
]
# Lean edge/Jetson profile: FastSAM-only + SigLIP + memory + API.
# Deliberately EXCLUDES torch/torchvision (install those per-platform first via
# `python scripts/install_torch.py` — on ARM they come from the NVIDIA Jetson
# index, not PyPI) and the heavy SAM2/GDINO CUDA-op backends.
# transformers IS required: SigLIP's tokenizer (open_clip HFTokenizer) imports it,
# and CLIP/SigLIP runs for every backend — verified on Jetson Orin (JetPack 6.2).
edge = [
    "open-clip-torch",
    "transformers>=4.44.0",
    "faiss-cpu>=1.12.0",
    "ultralytics>=8.4.0",
]
viz = [
    "open3d>=0.18.0",
    "matplotlib>=3.2.2",
    "seaborn>=0.11.0",
]
mcp = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
]
# Test-only dependencies for the canonical command
#   python -m pytest tests examples/rc_car_agent/tests -q -m "not gpu and not hardware and not models"
# (pytest-asyncio: 16 async tests fail, not skip, on pytest>=8.4 without it;
#  respx: tests/test_mcp_server.py; httpx: fastapi TestClient + [mcp];
#  websockets is already pulled by uvicorn[standard], pinned here for test_websocket_e2e.)
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "httpx>=0.27.0",
    "websockets>=12",
]
all = [
    "rtsm[gpu,viz,mcp]",
]

[project.scripts]
rtsm = "rtsm.cli:main"
rtsm-run = "rtsm.cli:main"
rtsm-mcp = "rtsm.io.mcp_server:main_sync"

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rtsm*"]
exclude = [
    "tests*",
    "scripts*",
    "docker*",
    "test_dataset*",
    "model_store*",
]

[tool.setuptools.package-data]
rtsm = ["cfg/**/*.yaml", "static/**", "data/demo_clip/*"]

[tool.pytest.ini_options]
# Explicit roots: a bare `python -m pytest` from the repo root collects exactly
# the two suites (core + rc_car_agent).
testpaths = ["tests", "examples/rc_car_agent/tests"]
# Collect ONLY test_*.py. pytest's default also matches *_test.py, and
# examples/rc_car_agent/watchdog_test.py / spin_test.py are HARDWARE scripts
# (watchdog_test.py drives the wheels at import time). Never collect them.
python_files = ["test_*.py"]
asyncio_mode = "strict"
markers = [
    "gpu: needs a CUDA device",
    "models: needs local weights in model_store/ (and ultralytics for YOLOE/FastSAM)",
    "hardware: needs a camera, robot, rosbridge or ZeroMQ publisher",
]
