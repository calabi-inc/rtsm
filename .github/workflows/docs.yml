name: Deploy Docs

# Every push to main that touches the docs rebuilds the site. The release number on the home page is resolved at build
# time by docs/hooks/version.py (the highest stable v* tag reachable from the built commit, so the checkout needs the
# tags); release.yml deploys the docs again from the tagged source once a version is on PyPI.

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install mkdocs-material

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
