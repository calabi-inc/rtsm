name: Docker

# Builds the image without pushing, so a broken Dockerfile fails the pull
# request that broke it. The publish to GHCR lives in release.yml (on tags).
# The build pulls the PyTorch CUDA wheels (about 3 GB), so it runs only when
# something that goes into the image changes, or on demand.

on:
  pull_request:
    paths:
      - "docker/**"
      - ".dockerignore"
      - "pyproject.toml"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build the image (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Free disk space (the runner has ~14 GB; the image needs most of it)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af > /dev/null
          df -h / | tail -1
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: rtsm:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (no GPU on the runner; CPU imports and the CLI)
        run: |
          docker run --rm rtsm:ci version
          docker run --rm rtsm:ci config validate
          docker run --rm --entrypoint python rtsm:ci -c "import torch, rtsm.core.pipeline, rtsm.io.bag_reader, rtsm.evaluation.runner; print('torch', torch.__version__, 'cuda build', torch.version.cuda)"
          docker run --rm --entrypoint python rtsm:ci -c "import os; assert os.environ['HF_HOME'] == '/models/hf'; import pwd; assert pwd.getpwuid(os.getuid()).pw_name == 'rtsm'; print('user + caches ok')"
          echo "image size: $(docker image inspect rtsm:ci --format '{{.Size}}' | awk '{printf "%.1f GB", $1/1e9}')"
